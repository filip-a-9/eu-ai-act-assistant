# Ruff configuration. In a ruff.toml rather than a pyproject.toml, which is
# the one place this repo departs from the usual convention.
#
# uv decides a directory is a uv project from the *existence* of a
# pyproject.toml, not from its contents. Adding one purely to hold [tool.ruff]
# makes uv write a uv.lock declaring zero dependencies, because this repo keeps
# its dependencies in requirements.txt. `uv sync --dry-run` against that lock
# listed 124 packages for removal, chromadb, langgraph and streamlit among
# them. A ruff.toml configures ruff identically and uv ignores it.
#
# The rule selection matters more than it looks. Ruff's own default is only
# E4, E7, E9 and F, which would not flag most of the findings this repo
# actually had -- B017, UP031 and RUF100 all come from families outside that
# default. Before this file existed those rules were firing from a user-level
# config outside the repository, so `ruff check` meant one thing on this
# machine and something much weaker on a fresh clone. Pinning the selection
# here is what lets the pre-commit hook enforce a standard the repository
# actually states.

line-length = 88
target-version = "py312"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear -- B017 pins what an immutability test may catch
    "UP",   # pyupgrade -- the codebase is 3.12+, so no legacy formatting
    "RUF",  # ruff's own rules, incl. RUF100 for noqa comments that no longer fire
]
ignore = [
    # The corpus is European legal text and the chunker's entire job is
    # surviving its markup: non-breaking spaces separate "Article" from its
    # number, and EUR-Lex quotes definitions with typographic quotation marks.
    # Those characters are deliberate test data in core/chunker.py,
    # scripts/build_chunks.py and tests/test_chunker.py. Flagging them as
    # ambiguous would put a suppression comment on every line whose purpose is
    # to hold the character, which is the lint fighting the domain.
    "RUF001",
    "RUF002",
    "RUF003",
    # zip(strict=True) raises where the current code truncates, so this is a
    # runtime behaviour change rather than a lint fix and needs a failing test
    # first. Scheduled separately: .claude/specs/zip-without-strict.md
    "B905",
]
